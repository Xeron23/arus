name: Core Regression Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend and native core regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npm run test:rust
