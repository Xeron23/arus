name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android NDK and SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install

      - name: Initialize Tauri Android
        run: |
          npx tauri android init --ci
          node scripts/android-prepare.mjs

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/release.keystore \
            -alias arus-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "aruspassword123" \
            -keypass "aruspassword123" \
            -dname "CN=Arus Finance, OU=Mobile, O=Arus, L=Jakarta, ST=Jakarta, C=ID"

      - name: Build Debug APK
        run: |
          npx tauri android build --apk --debug --target aarch64
          mkdir -p dist-apks
          BT="$ANDROID_HOME/build-tools/34.0.0"
          
          # Find generated debug APK
          DEBUG_RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*debug*.apk" | head -n 1)
          echo "Found debug raw: $DEBUG_RAW"
          
          # Zipalign and sign to ensure certificate validity
          "$BT/zipalign" -f -v 4 "$DEBUG_RAW" /tmp/debug-aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.keystore --ks-pass pass:aruspassword123 --key-pass pass:aruspassword123 --ks-key-alias arus-key --out dist-apks/arus-debug.apk /tmp/debug-aligned.apk
          "$BT/apksigner" verify --verbose dist-apks/arus-debug.apk

      - name: Build Release APK (Lightweight / Signed)
        run: |
          npx tauri android build --apk --target aarch64
          BT="$ANDROID_HOME/build-tools/34.0.0"
          
          # Find generated release APK
          RELEASE_RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*unsigned*.apk" -o -name "*release*.apk" | grep -v "debug" | head -n 1)
          echo "Found release raw: $RELEASE_RAW"
          
          # Zipalign and sign release APK
          "$BT/zipalign" -f -v 4 "$RELEASE_RAW" /tmp/release-aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.keystore --ks-pass pass:aruspassword123 --key-pass pass:aruspassword123 --ks-key-alias arus-key --out dist-apks/arus-release.apk /tmp/release-aligned.apk
          "$BT/apksigner" verify --verbose dist-apks/arus-release.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arus-signed-apks
          path: dist-apks/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Arus v0.1.0 — Local-First Personal Finance (Signed APK)
          body: |
            ## Arus v0.1.0 — Signed Android APK Release
            
            Aplikasi keuangan personal lokal (**100% Local-First**) tanpa backend server perantara.
            
            Semua APK sudah **di-align dan di-sign resmi (v2/v3 signing)** dengan `apksigner` sehingga kompatibel dan bisa langsung diinstal di semua perangkat Android (Android 7.0+ / arm64-v8a).
            
            ### Varian APK yang Tersedia:
            - **`arus-release.apk` (Lightweight / Optimized)**: Versi ramping (~20MB) dengan binary native yang sudah di-strip untuk penggunaan harian.
            - **`arus-debug.apk` (Developer / Diagnostics)**: Versi dengan symbol debug untuk tracing logcat dan pengujian developer.
            
            ### Panduan Instalasi di HP Android:
            1. Download file `arus-release.apk` ke HP Anda.
            2. Buka file APK melalui File Manager / Browser Download.
            3. Jika muncul peringatan *"Install unknown apps"*, pilih **Allow / Izinkan dari sumber ini**.
            4. Klik **Install**.
          files: |
            dist-apks/arus-debug.apk
            dist-apks/arus-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
