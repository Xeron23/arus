name: Build and Release Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install dependencies and validate
        run: |
          set -euo pipefail
          npm ci
          node scripts/check-version.mjs
          npm test
          npm run test:rust
          npm run build
        env:
          RELEASE_REF: ${{ github.ref }}
      - name: Setup Android SDK and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.0.13004108" "build-tools;35.0.0" "platforms;android-36"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Initialize Android
        run: |
          npx tauri android init --ci
          node scripts/android-prepare.mjs
      - name: Restore persistent release signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arus-release.jks"
          else
            echo "Generating consistent build keystore..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/arus-release.jks" \
              -alias arus-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "aruspassword123" \
              -keypass "aruspassword123" \
              -dname "CN=Arus Finance, OU=Mobile, O=Arus, L=Jakarta, ST=Jakarta, C=ID"
          fi
      - name: Build and sign release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || 'aruspassword123' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'aruspassword123' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'arus-key' }}
        run: |
          set -euo pipefail
          npx tauri android build --apk --target aarch64
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -d "$BT" || BT="$ANDROID_HOME/build-tools/34.0.0"
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*' -name '*-unsigned.apk')
          test "${#APKS[@]}" -ge 1 || { echo 'Expected at least one unsigned release APK'; exit 1; }
          mkdir -p dist-apks
          "$BT/zipalign" -f -P 16 4 "${APKS[0]}" "$RUNNER_TEMP/arus-aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/arus-release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist-apks/arus-release.apk "$RUNNER_TEMP/arus-aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs dist-apks/arus-release.apk
          "$BT/zipalign" -c -P 16 -v 4 dist-apks/arus-release.apk
          python3 scripts/release-manifest.py dist-apks/arus-release.apk "$BT/aapt"
      - name: Upload verified APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: arus-release-arm64
          path: dist-apks/*
          if-no-files-found: error
      - name: Stage release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Arus ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist-apks/arus-release.apk
            dist-apks/latest.json
      - name: Publish complete release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/arus-release.jks"
