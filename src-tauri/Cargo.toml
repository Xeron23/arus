[package]
name = "arus-mobile"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
[lib]
name = "arus_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
arus-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
zeroize = "1"

